name: Daily Refresh

# El Paso County lead intelligence — daily source refresh.
# Runs the active scrapers + EPCAD enrichment + dashboard regeneration,
# then commits the refreshed data back to main. Scope: clerk_recordings
# (the three deferred sources register into scripts/daily_refresh.py as
# they are built).

on:
  schedule:
    - cron: '0 10 * * *'        # 10:00 UTC daily (03:00 America/Denver)
  workflow_dispatch: {}          # manual trigger

permissions:
  contents: write                # needed to commit refreshed data

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run daily refresh
        # On scraper/pipeline failure this step exits non-zero and the
        # commit step below is skipped — no partial state is committed.
        run: python scripts/daily_refresh.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/el_paso_tx/ dashboard/data.json dashboard/data.js
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Daily refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

# CAPTCHA note (for when the Tyler Odyssey court sources are added):
# court_probate / court_civil run on Tyler Odyssey CRS, which can trigger
# a traffic-based reCAPTCHA. In CI, run those scrapers under xvfb-run for
# headed-mode emulation. If they still fail persistently in CI, drop them
# from SOURCES in daily_refresh.py for the CI path and mark them
# "manual refresh only — operator runs locally"; clerk_recordings (and the
# other non-court sources) continue refreshing daily.
