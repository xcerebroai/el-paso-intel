<!DOCTYPE html>
<html lang="en" data-ready="0">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Paso County Distress Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>El Paso County Distress Intelligence</h1>
      <p class="subtitle">Clerk-recorded distress events &middot; private operator artifact</p>
    </div>
    <div class="build-meta" id="buildMeta"></div>
  </header>

  <div class="banner" id="banner"></div>

  <main>
    <aside class="filters">
      <div class="filter-block">
        <label class="filter-label">Search owner / address</label>
        <input type="text" id="searchBox" placeholder="name or street&hellip;">
      </div>
      <div class="filter-block">
        <label class="filter-label">Distress signal type</label>
        <div id="signalFilter" class="checkgroup"></div>
      </div>
      <div class="filter-block">
        <label class="filter-label">Owner type</label>
        <div id="ownerFilter" class="checkgroup"></div>
      </div>
      <div class="filter-block">
        <label class="filter-label">Enrichment</label>
        <label class="toggle"><input type="checkbox" id="absenteeTog"> Absentee owner only</label>
        <label class="toggle"><input type="checkbox" id="oosTog"> Out-of-state owner only</label>
      </div>
      <div class="filter-block">
        <label class="filter-label">Signal stacking</label>
        <select id="stackMode">
          <option value="any">ANY signal (default)</option>
          <option value="all">ALL selected signal types</option>
          <option value="2">2+ signals</option>
          <option value="3">3+ signals</option>
        </select>
      </div>
      <div class="filter-block">
        <label class="filter-label">Sort</label>
        <select id="sortMode">
          <option value="signals">Signal count (high&rarr;low)</option>
          <option value="date">Latest event date</option>
          <option value="value">Assessed value</option>
          <option value="owner">Owner name</option>
        </select>
      </div>
      <button id="csvBtn" class="csv-btn">Export filtered CSV</button>
      <button id="resetBtn" class="reset-btn">Reset filters</button>
    </aside>

    <section class="results">
      <div class="results-head">
        <span id="rowCount" class="rowcount">&mdash;</span>
        <span class="legend">
          <span class="chip chip-distress legend-ex">distress signal</span>
          <span class="badge legend-ex">enrichment attribute</span>
        </span>
      </div>
      <table id="leadTable">
        <thead>
          <tr>
            <th>Owner</th>
            <th>Property address (situs)</th>
            <th>Mailing address</th>
            <th>Distress signals</th>
            <th>Attributes</th>
            <th class="num">Assessed</th>
            <th class="num">Signals</th>
            <th>Proof</th>
          </tr>
        </thead>
        <tbody id="leadBody"></tbody>
      </table>
      <p id="emptyMsg" class="empty" hidden>No leads match the current filters.</p>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
